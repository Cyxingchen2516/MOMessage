; ============================================================================
; MOMessage - 心灵终结独立"消息/雷达提示"插件
; 聊天/战役消息居中显示 + 雷达事件文字(基地/矿车/盟友基地遭袭等)
; 需要 MOMMessage.dll + MOMessage.dll.inj + 本文件 放在游戏根目录。
; ============================================================================

[MsgText]
; 总开关: 0=完全原版
Enable=1

; 战役/聊天消息框 (居中显示)
CampEnable=1
CampBottom=1      ; 1=贴屏幕底部居中显示
CampBottomMargin=150  ; 距屏幕底边像素 (越大越往上; 150 避开底部工具栏)
CampCentered=1    ; 1=水平居中
MaxLines=8        ; 同时显示几行
MaxWidth=550      ; 框宽(像素), 0=自动
FontFace=msyh.ttc ; 字体
FontHeight=0      ; 0=跟随游戏点阵字高
Bold=0
BoardOpacity=30   ; 底板不透明度 0~100
CampAnim=1        ; 打字机效果
ShowHotZone=0     ; 1=显示鼠标悬停热区的绿框(调试用), 0=隐藏

; 左下角"操作与战斗提示" (含雷达事件文字)
HintShow=1
HintRadarShow=1   ; 1=把雷达事件写成文字(基地遭袭/矿车遭袭/盟友基地遭袭等)
HintRadarClick=1  ; 1=点这行文字可把视角跳到事件地点
HintMaxLines=8
HintMaxWidth=400
HintBottom=150    ; 距底边像素
HintFontFace=simsun.ttc

[MsgRadar]
Name0=主要目标!
Name1=次要目标
Name2=空投区域
Name3=基地遭到袭击!
Name4=矿车遭到袭击!
Name5=发现敌军!
Name6=单位生产完毕
Name7=单位遭到损失
Name8=单位修复完成
Name9=建筑遭到渗透!
Name10=建筑已经占领
Name11=信标已放置
Name12=探测到超武!
Name13=超武已发动!
Name14=桥梁已修复
Name15=驻军已撤离
Name16=盟友基地遭袭!
NameOther=雷达事件

; ============================================================================
; 支援技能侧栏 (SWSBar, 已合并进本插件)
; 负数=隐藏, 0/缺键=1000, 正数=优先级
; ============================================================================

[SWSidebar]
Enable=1
; left / right
Side=left
; 1 = 不分阵营、平衡填充
FillMode=1
MaxCols=2
MaxRows=14
TopMargin=170
DedupDefensePage=1
Alpha=100
FontPx=12


